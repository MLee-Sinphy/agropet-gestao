<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venda - AgroPet Gestão</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/venda.css">

    <script defer src="../assets/js/venda.js"></script>

</head>

<body>

<header class="header">

    <h1>Venda</h1>

</header>

<main class="venda-layout">

    <aside class="menu-lateral">

        <button class="menu-item ativo">🐶 Pet</button>

        <button class="menu-item">👤 Responsável</button>

        <button class="menu-item">📦 Produtos</button>

        <button class="menu-item">💳 Pagamento</button>

    </aside>

    <section class="conteudo">

        <h2>Pet</h2>

        <div class="campo">

            <label>Nome</label>

            <input
                id="pet"
                type="text"
                placeholder="Comece digitando o nome do pet...">

            <div class="sugestoes"></div>

        </div>

        <div class="campo">

            <label>Espécie</label>

            <input type="text">

        </div>

        <div class="campo">

            <label>Raça</label>

            <input type="text">

        </div>

        <div class="campo">

            <label>Características</label>

            <textarea
                placeholder="Cor, porte, peso, alimentação, alergias ou qualquer outra informação útil."></textarea>

        </div>

    </section>

    <aside class="painel">

        <h2>Resumo</h2>

        <div class="placeholder">

            Selecione um pet para visualizar histórico, alertas e sugestões.

        </div>

    </aside>

</main>

</body>

</html>
