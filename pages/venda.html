<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Venda - AgroPet Gestão</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/venda.css">

    <script defer src="../assets/js/venda.js"></script>
</head>


<body>

<header class="header">
    <div>
        <h1>Nova Venda</h1>
    </div>
</header>


<main class="venda-container">


    <section class="venda-form">

        <div class="input-group">
            <label>Cliente</label>
            <input 
                type="text" 
                id="cliente"
                placeholder="Digite o nome do cliente">
        </div>


        <div class="input-group">
            <label>Pet</label>
            <input 
                type="text" 
                id="pet"
                placeholder="Digite o nome do pet">
        </div>


        <div class="input-group">
            <label>Produto</label>
            <input 
                type="text" 
                id="produto"
                placeholder="Digite o produto">
        </div>


        <div class="input-group">
            <label>Quantidade</label>
            <input 
                type="number" 
                value="1">
        </div>


        <button>
            Salvar Venda
        </button>


    </section>



    <aside class="historico">

        <h2>Informações do Cliente</h2>

        <div class="info-card">

            <p>
                Histórico de compras aparecerá aqui.
            </p>

            <p>
                Frequência de compras.
            </p>

            <p>
                Alertas futuros.
            </p>

        </div>

    </aside>


</main>


</body>

</html>
