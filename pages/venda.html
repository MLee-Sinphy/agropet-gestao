<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Venda - AgroPet Gestão</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/venda.css">

    <script defer src="../assets/js/venda.js"></script>
</head>

<body>

<header class="header">
    <h1>Nova Venda</h1>
</header>

<main class="venda-container">

    <section class="venda-form">

        <details open>
            <summary>Responsável</summary>

            <div class="input-group">
                <label>Nome</label>
                <input type="text" placeholder="Digite o nome...">
            </div>

            <div class="input-group">
                <label>Telefone</label>
                <input type="text" placeholder="(62) 99999-9999">
            </div>

            <details>
                <summary>Endereço</summary>

                <div class="input-group">
                    <label>CEP</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Rua</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Número</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Cidade</label>
                    <input type="text" value="Goiânia">
                </div>

            </details>

        </details>



        <details open>

            <summary>Pet</summary>

            <div class="input-group">
                <label>Nome</label>
                <input type="text" placeholder="Digite o nome do pet">
            </div>

            <div class="input-group">
                <label>Espécie</label>
                <input type="text">
            </div>

            <div class="input-group">
                <label>Raça</label>
                <input type="text">
            </div>

            <details>

                <summary>Observações</summary>

                <textarea
                    placeholder="Cor, porte, peso, comportamento, alimentação, alergias ou qualquer informação útil para futuras análises."></textarea>

            </details>

        </details>




        <details open>

            <summary>Produtos</summary>

            <div class="produto">

                <input
                    type="text"
                    placeholder="Produto">

                <input
                    type="number"
                    value="1">

            </div>

            <button class="secondary">
                + Adicionar Produto
            </button>

        </details>



        <button class="primary">
            Salvar Venda
        </button>

    </section>





    <aside class="historico">

        <h2>Resumo</h2>

        <div class="info-card">

            <h3>Pet</h3>

            <p>🐶 Rex</p>

            <h3>Responsáveis</h3>

            <p>Fernanda</p>
            <p>Paula</p>

            <hr>

            <h3>Últimas compras</h3>

            <p>Golden 15 kg</p>
            <p>NexGard</p>

            <hr>

            <h3>Alertas</h3>

            <p>⚠ Ração próxima do fim</p>

            <p>💡 Oferecer antipulgas</p>

        </div>

    </aside>

</main>

</body>

</html>
